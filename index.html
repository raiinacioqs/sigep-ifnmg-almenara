<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão Patrimonial - IFNMG - Campus Almenara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm border-0 p-4 rounded-4" style="width: 100%; max-width: 420px;">
        <!-- Cabeçalho do Card (Logo e Título do Sistema) -->
        <div class="d-flex justify-content-between align-items-start mb-4">
            <div>
                <h4 class="fw-bold text-dark mb-0">SIGEP</h4>
                <small class="text-muted">Sistema de Gestão Patrimonial</small>
            </div>
            <img src="img/almenara_horizontal_jpg.jpg" alt="Logo do IFNMG - Campus Almenara" style="max-height: 45px; width: auto" class="img-fluid">
        </div>

        <div class="mb-4">
            <h5 class="fw-bold text-dark">Login</h5>
            <p class="text-muted small mb-0">Acesse o Sistema de Gestão Patrimonial do IFNMG - Campus Almenara.</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label small fw-semibold text-secondary">Nome de usuário</label>
                <input type="text" class="form-control" id="email" placeholder="Usuário" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label small fw-semibold text-secondary">Senha</label>
                <input type="password" class="form-control" id="password" placeholder="Senha" required>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 mt-2 fw-semibold">Entrar</button>
        </form>

        <!-- Link de Suporte -->
        <div class="text-center mt-3">
            <a href="#" class="text-danger small text-decoration-none fw-semibold">? Ajuda / Suporte</a>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/login.js"></script>
</body>
</html>
